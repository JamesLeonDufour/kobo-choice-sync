name: Synchronize Kobo choices

on:
  repository_dispatch:
    types: [kobo_submission]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without modifying Kobo
        type: boolean
        default: true
      catch_up:
        description: Scan all historical submissions for missed choices (optional)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kobo-choice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configuration exists
        run: test -f config.json
      - name: Add latest submission to choices
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CATCH_UP: ${{ github.event_name == 'workflow_dispatch' && inputs.catch_up || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$CATCH_UP" = "true" ]; then
            args+=(--catch-up)
          fi
          python -m kobo_sync.sync "${args[@]}"
